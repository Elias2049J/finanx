server:
  port: ${SERVER_PORT}
  # Detras de nginx: respeta X-Forwarded-Proto/Host para URLs absolutas.
  forward-headers-strategy: framework
  # Apagado ordenado: deja terminar peticiones en vuelo.
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

spring:
  application:
    name: "mis-monedas"
  config:
    import: "optional:file:./.env[.properties]"

  lifecycle:
    timeout-per-shutdown-phase: 30s

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  sql:
    init:
      mode: never

  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER}
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:900}
    oauth2:
      resourceserver:
        jwt:
          audiences: ${JWT_AUDIENCES}
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - https://www.googleapis.com/auth/userinfo.profile
              - https://www.googleapis.com/auth/userinfo.email
        provider:
          google:
            issuer-uri: ${GOOGLE_ISSUER_URI}

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE}
      max-request-size: ${MAX_REQUEST_SIZE}

logging:
  level:
    org.springframework.boot.context.config: INFO
    org.springframework.core.env: INFO
    com.zaxxer.hikari: INFO

app:
  # Entorno logico: development | production. En production el backend falla
  # al arrancar si detecta configuracion insegura (auto-premium, Play Billing
  # fake, Swagger abierto, URLs locales o JWT de ejemplo).
  environment: ${APP_ENV:development}
  time:
    default-zone: ${APP_TIME_DEFAULT_ZONE}
  billing:
    # Regala PREMIUM a cada registro. Solo para desarrollo; por defecto off.
    auto-premium: ${APP_BILLING_AUTO_PREMIUM:false}
    # Endpoint /webhooks/{provider}. Solo tiene sentido con un PaymentPort real; por defecto off.
    webhooks:
      enabled: ${APP_BILLING_WEBHOOKS_ENABLED:false}
    # Pagos estancados que pasan a FAILED. La suscripcion no se toca.
    payment-expiration:
      pending-minutes: ${APP_BILLING_PAYMENT_EXPIRATION_PENDING_MINUTES:1440}
      processing-minutes: ${APP_BILLING_PAYMENT_EXPIRATION_PROCESSING_MINUTES:60}
    # Verificacion de compras de Google Play.
    # disabled: no permite verificar (produccion hasta tener service account).
    # fake: acepta tokens test-valid-* y no llama a Google (solo desarrollo).
    google-play:
      mode: ${APP_BILLING_GOOGLE_PLAY_MODE:disabled}
      package-name: ${APP_BILLING_GOOGLE_PLAY_PACKAGE_NAME:com.elias.mismonedas}
      monthly-product-id: ${APP_BILLING_GOOGLE_PLAY_MONTHLY_PRODUCT_ID:premium_monthly_test}
      annual-product-id: ${APP_BILLING_GOOGLE_PLAY_ANNUAL_PRODUCT_ID:premium_annual_test}
      monthly-price: ${APP_BILLING_GOOGLE_PLAY_MONTHLY_PRICE:19.90}
      annual-price: ${APP_BILLING_GOOGLE_PLAY_ANNUAL_PRICE:199.00}
      currency: ${APP_BILLING_GOOGLE_PLAY_CURRENCY:PEN}
  ai:
    max-user-prompt-length: 500
    max-output-tokens: 1024
    advisor-temperature: 0.3
    chitchat-temperature: 0.7
    timeout-ms: 15000
  gemini:
    base-url: ${APP_GEMINI_BASE_URL}
    api-key: ${GEMINI_API_KEY}
    model:
      primary: ${APP_GEMINI_MODEL_PRIMARY}
  google:
    issuer: ${GOOGLE_ISSUER_URI}
    jwks: ${GOOGLE_JWKS_URI}
  front-url: ${APP_FRONT_URL}
  notifications:
    email:
      host: ${APP_NOTIFICATIONS_EMAIL_HOST}
      port: ${APP_NOTIFICATIONS_EMAIL_PORT}
      from: ${APP_NOTIFICATIONS_EMAIL_FROM}
      username: ${APP_NOTIFICATIONS_EMAIL_USERNAME}
      app-password: ${EMAIL_APP_PASSWORD}
    fcm:
      credentials-path: ${FCM_CREDENTIALS_PATH}
      project-id: ${FCM_PROJECT_ID}

  email-verification:
    hmac-secret: ${EMAIL_VERIFICATION_HMAC_SECRET:${JWT_SECRET}}
    global-send-limit-per-minute: ${APP_EMAIL_VERIFICATION_GLOBAL_SEND_LIMIT_PER_MINUTE:10}

  exchange:
    currency-beacon:
      api-key: ${CURRENCYBEACON_API_KEY}
      api-url: ${CURRENCYBEACON_API_URL}

springdoc:
  # La documentacion interactiva queda apagada por defecto. En desarrollo local
  # se puede habilitar con SPRINGDOC_ENABLED=true.
  api-docs.enabled: ${SPRINGDOC_ENABLED:false}
  api-docs.version: openapi_3_0
  swagger-ui.enabled: ${SPRINGDOC_ENABLED:false}

  model-converters.polymorphic-converter.enabled: false
  override-with-generic-response: false

resilience4j:
  retry:
    retry-aspect-order: 1
    instances:
      currencybeacon:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - org.springframework.web.client.RestClientException
  circuitbreaker:
    circuit-breaker-aspect-order: 2
    instances:
      gemini:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        record-exceptions:
          - com.elias.mismonedas.shared.adapter.ai.gemini.exception.GeminiException$UnavailableException
          - com.elias.mismonedas.shared.adapter.ai.gemini.exception.GeminiException$RateLimitException
        ignore-exceptions:
          - com.elias.mismonedas.shared.adapter.ai.gemini.exception.GeminiException$InvalidRequestException
          - com.elias.mismonedas.shared.adapter.ai.gemini.exception.GeminiException$AuthException
      currencybeacon:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
      email:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 60
        wait-duration-in-open-state: 60s
        record-exceptions:
          - com.elias.mismonedas.notifications.adapter.email.EmailTransportException
        ignore-exceptions:
          - com.elias.mismonedas.identity.util.InvalidEmailAddressException
      fcm:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 60
        wait-duration-in-open-state: 60s
  bulkhead:
    instances:
      gemini:
        max-concurrent-calls: 8
        max-wait-duration: 1s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
