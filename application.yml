server:
  port: ${SERVER_PORT}

spring:
  application:
    name: "mis-monedas"
  config:
    # Toda la configuracion por entorno vive en `.env` (gitignored). Spring lo
    # lee como un archivo de properties; `.env.example` es la plantilla.
    # El bootstrap esta documentado en README.md.
    import: "optional:file:./.env[.properties]"

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  # flyway:
  #   enabled: true
  #   locations: classpath:db/migration
  #   baseline-on-migrate: false
  #   validate-on-migrate: true

  sql:
    init:
      mode: never

  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER}
      expiration-seconds: ${JWT_EXPIRATION_SECONDS}
    oauth2:
      resourceserver:
        jwt:
          audiences: ${JWT_AUDIENCES}
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - https://www.googleapis.com/auth/userinfo.profile
              - https://www.googleapis.com/auth/userinfo.email
        provider:
          google:
            issuer-uri: ${GOOGLE_ISSUER_URI}

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE}
      max-request-size: ${MAX_REQUEST_SIZE}

logging:
  level:
    org.springframework.boot.context.config: INFO
    org.springframework.core.env: INFO
    com.zaxxer.hikari: INFO

app:
  time:
    default-zone: ${APP_TIME_DEFAULT_ZONE}
  ai:
    max-user-prompt-length: 500
    max-output-tokens: 1024
    advisor-temperature: 0.3
    chitchat-temperature: 0.7
    timeout-ms: 15000
  gemini:
    base-url: ${APP_GEMINI_BASE_URL}
    api-key: ${GEMINI_API_KEY}
    model:
      primary: ${APP_GEMINI_MODEL_PRIMARY}
      fallback: ${APP_GEMINI_MODEL_FALLBACK}
  google:
    issuer: ${GOOGLE_ISSUER_URI}
    jwks: ${GOOGLE_JWKS_URI}
  front-url: ${APP_FRONT_URL}
  front-url-https: ${APP_FRONT_URL_HTTPS}
  notifications:
    gmail:
      host: ${APP_NOTIFICATIONS_GMAIL_HOST}
      port: ${APP_NOTIFICATIONS_GMAIL_PORT}
      from: ${APP_NOTIFICATIONS_GMAIL_FROM}
      username: ${APP_NOTIFICATIONS_GMAIL_USERNAME}
      app-password: ${GMAIL_APP_PASSWORD}

    fcm:
      credentials-path: ${FCM_CREDENTIALS_PATH}
      project-id: ${FCM_PROJECT_ID}
  exchange:
    currency-beacon:
      api-key: ${CURRENCYBEACON_API_KEY}
      api-url: ${CURRENCYBEACON_API_URL}

springdoc:
  api-docs.enabled: true
  api-docs.version: openapi_3_0
  swagger-ui.enabled: true

  model-converters.polymorphic-converter.enabled: false
  override-with-generic-response: false

resilience4j:
  retry:
    retry-aspect-order: 1
    instances:
      currencybeacon:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - org.springframework.web.client.RestClientException
  circuitbreaker:
    circuit-breaker-aspect-order: 2
    instances:
      gemini:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        record-exceptions:
          - com.elias.mismonedas.shared.adapter.ai.gemini.exception.GeminiException$UnavailableException
          - com.elias.mismonedas.shared.adapter.ai.gemini.exception.GeminiException$RateLimitException
        ignore-exceptions:
          - com.elias.mismonedas.shared.adapter.ai.gemini.exception.GeminiException$InvalidRequestException
          - com.elias.mismonedas.shared.adapter.ai.gemini.exception.GeminiException$AuthException
      currencybeacon:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
      gmail:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 60
        wait-duration-in-open-state: 60s
      fcm:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 60
        wait-duration-in-open-state: 60s
  bulkhead:
    instances:
      gemini:
        max-concurrent-calls: 8
        max-wait-duration: 0s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
