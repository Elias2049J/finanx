events {
    worker_connections 1024;
}

http {
    upstream backend {
        server mismonedas:8080;
    }

    # SeaweedFS S3 (descarga de imágenes por URL prefirmada).
    upstream storage {
        server seaweedfs:8333;
    }

    # --- API (host oficial / por defecto) ---
    server {
        listen 80;
        server_name _;

        client_max_body_size 20M;

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        location /actuator/health {
            proxy_pass http://backend;
            access_log off;
        }
    }

    # --- Storage (host dedicado) ---
    # Solo se usa si pones a nginx delante de SeaweedFS con un subdominio
    # propio (p. ej. storage.tudominio.com -> nginx -> seaweedfs:8333).
    #
    # En dev con ngrok NO hace falta: apunta el segundo túnel directo a
    # seaweedfs:8333 y pon ese host en SEAWEEDFS_PUBLIC_ENDPOINT (.env).
    # Con Cloudflare Tunnel tampoco: el túnel puede ir directo a seaweedfs.
    #
    # Para activarlo, cambia `server_name` por tu subdominio real (y ajusta el
    # DNS/TLS según tu setup).
    #
    # IMPORTANTE: `proxy_set_header Host $host` es OBLIGATORIO. La firma SigV4
    # de la URL prefirmada incluye el host, así que nginx debe reenviar el Host
    # original y NO reescribir la ruta (no usar `proxy_pass` con path).
    server {
        listen 80;
        server_name storage.local;

        client_max_body_size 20M;

        location / {
            proxy_pass http://storage;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }
    }
}
