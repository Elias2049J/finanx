events {
    worker_connections 1024;
}

http {
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=storage:10m rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;
    limit_conn_log_level warn;

    upstream backend {
        server mismonedas:8080;
    }

    # SeaweedFS S3 (descarga de imágenes por URL prefirmada).
    upstream storage {
        server seaweedfs:8333;
    }

    # --- API (host oficial / por defecto) ---
    server {
        listen 80;
        server_name _;

        client_max_body_size 20M;

        location /api/v1/auth/ {
            limit_req zone=auth burst=10 nodelay;
            limit_conn perip 10;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        location / {
            limit_req zone=api burst=40 nodelay;
            limit_conn perip 20;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        location /actuator/health {
            proxy_pass http://backend;
            access_log off;
        }
    }

    # --- Storage (puerto dedicado) ---
    # El host público configurado en SEAWEEDFS_PUBLIC_ENDPOINT debe apuntar
    # aquí (o a un túnel que termine en este puerto), nunca a seaweedfs:8333.
    #
    # IMPORTANTE: `proxy_set_header Host $host` es OBLIGATORIO. La firma SigV4
    # de la URL prefirmada incluye el host, así que nginx debe reenviar el Host
    # original y NO reescribir la ruta (no usar `proxy_pass` con path).
    server {
        listen 8081;
        server_name _;

        client_max_body_size 20M;

        location / {
            limit_except GET HEAD {
                deny all;
            }

            limit_req zone=storage burst=100 nodelay;
            limit_conn perip 20;
            proxy_pass http://storage;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }
    }
}
