<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="margin:0;padding:0;background-color:#f4f4f7;">
  <div style="max-width:560px;margin:0 auto;padding:24px 16px;font-family:Arial,Helvetica,sans-serif;">
    <div style="background-color:#1f2937;color:#ffffff;padding:16px 24px;font-size:18px;font-weight:bold;border-radius:12px 12px 0 0;">
      Finanx
    </div>
    <div style="background-color:#16a34a;height:4px;"></div>
    <div style="background-color:#ffffff;padding:24px;border:1px solid #e5e7eb;border-radius:0 0 12px 12px;">
      <h1 style="font-size:20px;color:#111827;margin:0 0 16px;" th:text="${heading}">Savings goal completed!</h1>
      <p style="color:#4b5563;font-size:14px;line-height:1.5;margin:0 0 16px;">
        <span th:text="${intro}">Congratulations, you reached your goal.</span>
      </p>
      <div style="background-color:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:16px;margin-bottom:16px;">
        <div style="font-size:12px;color:#6b7280;margin-bottom:4px;" th:text="${accumulatedLabel}">Saved so far</div>
        <div style="font-size:24px;font-weight:bold;color:#16a34a;">
          <span th:text="${accumulated}">0.00</span> <span th:text="${currency}">PEN</span>
        </div>
        <div style="font-size:12px;color:#6b7280;margin-top:8px;"><span th:text="${targetLabel}">of a goal of</span> <span th:text="${targetAmount}">0.00</span> <span th:text="${currency}">PEN</span></div>
      </div>
      <div style="border-top:1px solid #f0f0f2;padding-top:12px;font-size:13px;color:#6b7280;">
        <span th:text="${lastContributionText}">Last contribution details.</span>
      </div>
    </div>
    <div style="text-align:center;color:#9ca3af;font-size:12px;padding:16px;">
      <span th:text="${disclaimer}">Automated email.</span>
    </div>
  </div>
</body>
</html>
