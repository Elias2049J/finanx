version: '3.8'
services:
  mismonedas:
    build: .
    container_name: spring_app
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/db_mismonedas
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 12345678
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-finanx}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-finanx-dev}
      SPRING_RABBITMQ_CONNECTION_TIMEOUT: 1s
      SPRING_RABBITMQ_PUBLISHER_CONFIRM_TYPE: correlated
      SPRING_RABBITMQ_PUBLISHER_RETURNS: "true"
      SPRING_RABBITMQ_TEMPLATE_MANDATORY: "true"
      APP_STORAGE_SEAWEEDFS_INTERNAL_ENDPOINT: http://seaweedfs:8333
      APP_STORAGE_SEAWEEDFS_PUBLIC_ENDPOINT: ${SEAWEEDFS_PUBLIC_ENDPOINT:-http://localhost:8333}
      APP_STORAGE_SEAWEEDFS_BUCKET: ${SEAWEEDFS_BUCKET:-finanx-images}
      APP_STORAGE_SEAWEEDFS_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY:-finanx-storage}
      APP_STORAGE_SEAWEEDFS_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY:-finanx-storage-dev}
      APP_STORAGE_SEAWEEDFS_PRESIGNED_URL_TTL: 5m
    networks:
      - springnet
    restart: unless-stopped

  doc-processing:
    build: ./services/doc-processing
    container_name: doc_processing
    depends_on:
      rabbitmq:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-finanx}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-finanx-dev}
      SCAN_QUEUE: receipt.scan.job
      SCAN_RESULT_EXCHANGE: receipt.scan.result
      SCAN_RESULT_ROUTING_KEY: receipt.scan.result
      S3_ENDPOINT: http://seaweedfs:8333
      S3_REGION: us-east-1
      S3_BUCKET: ${SEAWEEDFS_BUCKET:-finanx-images}
      S3_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY:-finanx-storage}
      S3_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY:-finanx-storage-dev}
      OCR_LANG: es
    networks:
      - springnet
    restart: unless-stopped

  db:
    image: postgres:17
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: db_mismonedas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345678
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - springnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq_broker
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-finanx}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-finanx-dev}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - springnet
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    container_name: seaweedfs_object_store
    command: ["mini", "-dir=/data"]
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY:-finanx-storage}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY:-finanx-storage-dev}
      S3_BUCKET: ${SEAWEEDFS_BUCKET:-finanx-images}
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs_data:/data
    networks:
      - springnet

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - mismonedas
    networks:
      - springnet
    restart: unless-stopped

networks:
  springnet:

volumes:
  postgres_data:
  rabbitmq_data:
  seaweedfs_data:
