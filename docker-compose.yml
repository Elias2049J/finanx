services:
  mismonedas:
    build: .
    container_name: spring_app
    ports:
      - "127.0.0.1:8082:8080"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/db_mismonedas
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SPRING_RABBITMQ_CONNECTION_TIMEOUT: 1s
      SPRING_RABBITMQ_PUBLISHER_CONFIRM_TYPE: correlated
      SPRING_RABBITMQ_PUBLISHER_RETURNS: "true"
      SPRING_RABBITMQ_TEMPLATE_MANDATORY: "true"
      APP_STORAGE_SEAWEEDFS_INTERNAL_ENDPOINT: http://seaweedfs:8333
      APP_STORAGE_SEAWEEDFS_PUBLIC_ENDPOINT: ${SEAWEEDFS_PUBLIC_ENDPOINT:-http://localhost:8081}
      APP_STORAGE_SEAWEEDFS_BUCKET: ${SEAWEEDFS_BUCKET:-finanx-images}
      APP_STORAGE_SEAWEEDFS_ACCESS_KEY_FILE: /run/secrets/seaweedfs_access_key
      APP_STORAGE_SEAWEEDFS_SECRET_KEY_FILE: /run/secrets/seaweedfs_secret_key
      APP_STORAGE_SEAWEEDFS_PRESIGNED_URL_TTL: 5m
      FCM_CREDENTIALS_PATH: /run/secrets/firebase-sa
      # Solo en el compose de desarrollo: asigna PREMIUM a cada registro.
      APP_BILLING_AUTO_PREMIUM: "true"
      APP_BILLING_WEBHOOKS_ENABLED: "false"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    secrets:
      - firebase-sa
      - seaweedfs_access_key
      - seaweedfs_secret_key
    networks:
      - springnet
    restart: unless-stopped

  doc-processing:
    build: ./services/doc-processing
    container_name: doc_processing
    depends_on:
      rabbitmq:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SCAN_EXCHANGE: receipt.scan
      SCAN_ROUTING_KEY: receipt.scan.job
      SCAN_QUEUE: receipt.scan.job
      SCAN_RESULT_EXCHANGE: receipt.scan.result
      SCAN_RESULT_ROUTING_KEY: receipt.scan.result
      S3_ENDPOINT: http://seaweedfs:8333
      S3_REGION: us-east-1
      S3_BUCKET: ${SEAWEEDFS_BUCKET:-finanx-images}
      S3_ACCESS_KEY_FILE: /run/secrets/seaweedfs_access_key
      S3_SECRET_KEY_FILE: /run/secrets/seaweedfs_secret_key
      OCR_LANG: es
    secrets:
      - seaweedfs_access_key
      - seaweedfs_secret_key
    networks:
      - springnet
    restart: unless-stopped

  db:
    image: postgres:17
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: db_mismonedas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - springnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq_broker
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - springnet
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:15672:15672"

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    container_name: seaweedfs_object_store
    entrypoint: ["/bin/sh", "/usr/local/bin/seaweedfs-entrypoint.sh"]
    command: ["mini", "-dir=/data"]
    restart: unless-stopped
    environment:
      S3_BUCKET: ${SEAWEEDFS_BUCKET:-finanx-images}
    volumes:
      - seaweedfs_data:/data
      - ./docker/seaweedfs-entrypoint.sh:/usr/local/bin/seaweedfs-entrypoint.sh:ro
    secrets:
      - seaweedfs_access_key
      - seaweedfs_secret_key
    networks:
      - springnet
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9333/cluster/status >/dev/null 2>&1 && wget -qO- http://localhost:8333/status >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "80:80"
      - "443:443"
      - "8081:8081"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - mismonedas
      - seaweedfs
    networks:
      - springnet
    restart: unless-stopped

networks:
  springnet:

secrets:
  firebase-sa:
    file: ${FCM_CREDENTIALS_FILE:-./secrets/firebase-service-account.json}
  seaweedfs_access_key:
    file: ${SEAWEEDFS_ACCESS_KEY_FILE:-./secrets/seaweedfs_access_key}
  seaweedfs_secret_key:
    file: ${SEAWEEDFS_SECRET_KEY_FILE:-./secrets/seaweedfs_secret_key}

volumes:
  postgres_data:
  rabbitmq_data:
  seaweedfs_data:
