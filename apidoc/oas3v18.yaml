    NotificationDTO:
      type: object
      description: Objeto de transferencia que representa una notificacion generada
        en el sistema
      properties:
        id:
          type: integer
          format: int64
          description: Identificador unico de la notificacion
          example: 1001
        userId:
          type: integer
          format: int64
          description: Identificador del usuario asociado a la notificacion
          example: 42
        userEmail:
          type: string
          description: Correo electronico del usuario
          example: usuario@ejemplo.com
        emailNotifications:
          type: boolean
          description: Indica si el usuario tiene habilitadas las notificaciones por
            email
          example: true
        fcmTokens:
          type: array
          description: Tokens FCM del usuario para notificaciones push
          example:
            - fM8x...abc123
          items:
            type: string
        type:
          type: string
          description: Tipo de notificacion
          enum:
            - WARNING
            - SUCCESS
            - ERROR
            - INFO
          example: ALERTA_PRESUPUESTO
        message:
          type: string
          description: Mensaje de la notificacion
          example: Has alcanzado el 80% de tu presupuesto de alimentacion
        createdAt:
          type: string
          format: date-time
          description: Fecha y hora de creacion de la notificacion
          example: 2026-06-25T23:59:59
        disabledAt:
          type: string
          format: date-time
          description: "Fecha y hora en que la notificacion fue deshabilitada, si\
            \ aplica"
          example: 2026-07-01T12:00:00
        scheduledAt:
          type: string
          format: date-time
          description: Fecha y hora programada para enviar la notificacion
          example: 2026-06-30T08:00:00
        sentAt:
          type: string
          format: date-time
          description: Fecha y hora en que la notificacion fue enviada
          example: 2026-06-30T08:01:00
        state:
          type: string
          description: Estado actual de la notificacion
          enum:
            - SCHEDULED
            - SENT
            - READ
            - DISCARD
          example: SENT
        scheduleId:
          type: integer
          format: int64
          description: Identificador de la programacion asociada
          example: 200
        budgetId:
          type: integer
          format: int64
          description: Identificador del presupuesto asociado
          example: 300
        budgetDescription:
          type: string
          description: Descripcion del presupuesto asociado
          example: Presupuesto de transporte
        budgetState:
          type: string
          description: Estado del presupuesto asociado
          enum:
            - ACTIVE
            - CANCELLED
            - DISABLED
            - FINALIZED
          example: ACTIVE
        savingGoalId:
          type: integer
          format: int64
          description: Identificador de la meta de ahorro asociada
          example: 400
        savingGoalDescription:
          type: string
          description: Descripcion de la meta de ahorro asociada
          example: Ahorro para viaje
