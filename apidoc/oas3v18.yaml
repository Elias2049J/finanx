components:
  schemas:
    WalletRequest:
      type: object
      description: Solicitud para crear o actualizar una billetera
      properties:
        currencyCode:
          type: string
          description: Codigo de moneda (ISO 4217)
          example: PEN
          maxLength: 3
          minLength: 3
        primary:
          type: boolean
          description: Indica si es la billetera principal
          example: true
      required:
        - currencyCode
    WalletResponse:
      type: object
      description: Respuesta que representa una billetera
      properties:
        id:
          type: integer
          format: int64
          description: Identificador unico de la billetera
          example: 1
        userId:
          type: integer
          format: int64
          description: Identificador del usuario propietario
          example: 42
        currencyCode:
          type: string
          description: Codigo de moneda (ISO 4217)
          example: PEN
        balance:
          type: number
          description: Balance actual
          example: "1500.00"
        primary:
          type: boolean
          description: Indica si es la billetera principal
          example: true
    UserPreferencesRequest:
      type: object
      description: Solicitud para actualizar preferencias del usuario
      properties:
        timeZone:
          type: string
          description: Zona horaria preferida
          enum:
            - AMERICA_LIMA
            - AMERICA_BOGOTA
            - AMERICA_QUITO
            - AMERICA_CARACAS
            - AMERICA_LA_PAZ
            - AMERICA_ASUNCION
            - AMERICA_MONTEVIDEO
            - AMERICA_SANTIAGO
            - AMERICA_BUENOS_AIRES
            - AMERICA_GUATEMALA
            - AMERICA_COSTA_RICA
            - AMERICA_TEGUCIGALPA
            - AMERICA_EL_SALVADOR
            - AMERICA_MANAGUA
            - AMERICA_PANAMA
            - AMERICA_HAVANA
            - AMERICA_SANTO_DOMINGO
            - AMERICA_PUERTO_RICO
            - AMERICA_MEXICO_CITY
            - EUROPE_MADRID
            - AFRICA_CEUTA
            - ATLANTIC_CANARY
            - AMERICA_NEW_YORK
            - AMERICA_LOS_ANGELES
          example: AMERICA_LIMA
        currencyCode:
          type: string
          description: Codigo de moneda por defecto
          example: PEN
          maxLength: 3
          minLength: 3
        emailNotifications:
          type: boolean
          description: Notificaciones por email habilitadas
          example: true
      required:
        - currencyCode
        - timeZone
    UserPreferencesResponse:
      type: object
      description: Preferencias del usuario
      properties:
        id:
          type: integer
          format: int64
          description: Identificador unico
          example: 1
        timeZone:
          type: string
          description: Zona horaria preferida
          enum:
            - AMERICA_LIMA
            - AMERICA_BOGOTA
            - AMERICA_QUITO
            - AMERICA_CARACAS
            - AMERICA_LA_PAZ
            - AMERICA_ASUNCION
            - AMERICA_MONTEVIDEO
            - AMERICA_SANTIAGO
            - AMERICA_BUENOS_AIRES
            - AMERICA_GUATEMALA
            - AMERICA_COSTA_RICA
            - AMERICA_TEGUCIGALPA
            - AMERICA_EL_SALVADOR
            - AMERICA_MANAGUA
            - AMERICA_PANAMA
            - AMERICA_HAVANA
            - AMERICA_SANTO_DOMINGO
            - AMERICA_PUERTO_RICO
            - AMERICA_MEXICO_CITY
            - EUROPE_MADRID
            - AFRICA_CEUTA
            - ATLANTIC_CANARY
            - AMERICA_NEW_YORK
            - AMERICA_LOS_ANGELES
          example: AMERICA_LIMA
        currencyCode:
          type: string
          description: Codigo de moneda por defecto
          example: PEN
        emailNotifications:
          type: boolean
          description: Notificaciones por email habilitadas
          example: true
        fcmTokens:
          type: array
          description: Tokens FCM registrados
          example:
            - fM8x...abc123
          items:
            type: string
        createdAt:
          type: string
          format: date-time
          description: Fecha de creacion
          example: 2026-06-25T23:59:59
        updatedAt:
          type: string
          format: date-time
          description: Ultima actualizacion
          example: 2026-07-01T12:00:00
    UserRequest:
      type: object
      description: Solicitud para registrar un nuevo usuario en el sistema
      properties:
        name:
          type: string
          description: Nombres del usuario
          example: Jorge Jackson
          minLength: 1
        lastname:
          type: string
          description: Apellidos del usuario
          example: Valdivia Torreon
          minLength: 1
        email:
          type: string
          format: email
          description: Correo electronico del usuario
          example: jorge.valdivia@example.com
          minLength: 1
        username:
          type: string
          description: Nombre de usuario unico
          example: UsuarioFin2026
          minLength: 1
        password:
          type: string
          description: Contrasena del usuario
          example: StrongPassword123!
          minLength: 1
      required:
        - email
        - lastname
        - name
        - password
        - username
    UserResponse:
      type: object
      description: Respuesta que representa un usuario registrado en el sistema
      properties:
        id:
          type: integer
          format: int64
          description: Identificador unico del usuario
          example: 42
        name:
          type: string
          description: Nombres del usuario
          example: Jorge Jackson
        lastname:
          type: string
          description: Apellidos del usuario
          example: Valdivia Torreon
        email:
          type: string
          description: Correo electronico del usuario
          example: jorge.valdivia@example.com
        username:
          type: string
          description: Nombre de usuario unico
          example: UsuarioFin2026
        role:
          type: string
          description: Rol asignado al usuario
          enum:
            - USER
            - SYSTEM
          example: USER
        state:
          type: string
          description: Estado actual del usuario
          enum:
            - ENABLED
            - BLOCKED
            - DISABLED
          example: ENABLED
        moneyBalance:
          type: number
          description: Balance monetario del usuario
          example: "1500.00"
        createdAt:
          type: string
          format: date-time
          description: Fecha y hora de creacion del usuario
          example: 2026-06-25T23:59:59
        disabledAt:
          type: string
          format: date-time
          description: "Fecha y hora en que el usuario fue deshabilitado, si aplica"
          example: 2026-07-01T12:00:00
        fullName:
          type: string
          description: Nombre completo del usuario en formato concatenado
          example: JORGE JACKSON VALDIVIA TORREON
        preferences:
          $ref: "#/components/schemas/UserPreferencesResponse"
          description: Preferencias del usuario
    TransactionRequest:
      type: object
      description: "Solicitud para registrar una transaccion asociada a un usuario,\
        \ categoria y opcionalmente a un motivo o meta de ahorro"
      properties:
        walletId:
          type: integer
          format: int64
          description: Identificador unico de la billetera asociada a la transaccion
          example: 1
        categoryId:
          type: integer
          format: int64
          description: Identificador unico de la categoria asociada a la transaccion
          example: 101
        reasonId:
          type: integer
          format: int64
          description: "Identificador del motivo asociado a la transaccion, si aplica"
          example: 501
        description:
          type: string
          description: Descripcion de la transaccion
          example: Compra de libros universitarios
        savingGoalId:
          type: integer
          format: int64
          description: "Identificador de la meta de ahorro asociada, si aplica"
          example: 3001
        receiptId:
          type: integer
          format: int64
          description: "Identificador del recibo escaneado vÃ­a OCR, si aplica"
          example: 1
        amount:
          type: number
          description: Monto de la transaccion (debe ser mayor a 0)
          example: "150.75"
          minimum: 0.00
        paymentMethod:
          type: string
          description: Metodo de pago utilizado en la transaccion
          enum:
            - CASH
            - CREDIT_CARD
            - DEBIT_CARD
            - BANK_TRANSFER
            - YAPE
            - PLIN
            - OTHER
          example: CREDIT_CARD
        type:
          type: string
          description: Tipo de transaccion (ingreso o gasto)
          enum:
            - SPENT
            - INCOME
          example: SPENT
        convertCurrency:
          type: boolean
          default: false
          description: "Si true y receiptId presente, convierte el monto del recibo\
            \ (currencyGuess) a la moneda del wallet usando el exchange service"
          example: false
      required:
        - amount
        - categoryId
        - paymentMethod
        - type
        - walletId
    TransactionResponse:
      type: object
      description: Respuesta que representa una transaccion registrada en el sistema
      properties:
        id:
          type: integer
          format: int64
          description: Identificador unico de la transaccion
          example: 10001
        walletId:
          type: integer
          format: int64
          description: Identificador unico de la billetera asociada a la transaccion
          example: 1
        walletCurrency:
          type: string
          description: Moneda de la billetera
          example: PEN
        walletPrimary:
          type: boolean
          description: Indica si la billetera es principal
          example: true
        categoryId:
          type: integer
          format: int64
          description: Identificador unico de la categoria asociada a la transaccion
          example: 101
        categoryName:
          type: string
          description: Nombre de la categoria asociada a la transaccion
          example: Alimentacion
        reasonId:
          type: integer
          format: int64
          description: "Identificador del motivo asociado a la transaccion, si aplica"
          example: 501
        reasonDescription:
          type: string
          description: Descripcion del motivo asociado a la transaccion
          example: Compra de utiles escolares
        savingGoalId:
          type: integer
          format: int64
          description: "Identificador de la meta de ahorro asociada, si aplica"
          example: 3001
        scheduleId:
          type: integer
          format: int64
          description: "Identificador de la programacion asociada, si aplica"
          example: 2001
        receiptId:
          type: integer
          format: int64
          description: "Identificador del recibo asociado, si aplica"
          example: 4001
        receiptImageId:
          type: integer
          format: int64
          description: "Identificador de la imagen del recibo asociado, si aplica"
          example: 4001
        amount:
