  /receipts/scan:
    post:
      tags:
        - Receipts
      summary: Escanear recibo con OCR
      description: "Procesa una imagen de recibo, extrae texto via Tesseract y parsea\
        \ los datos (monto, fecha, comercio). Requiere plan PREMIUM."
      operationId: scanReceipt
      parameters:
        - name: userId
          in: query
          description: ID del usuario
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                  description: Imagen del recibo (max 5MB)
              required:
                - image
      responses:
        "200":
          description: Escaneo completado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReceiptResponse"
        "400":
          description: Imagen invalida o muy grande
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReceiptResponse"
        "403":
          description: Plan no suficiente (PLAN_REQUIRED)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReceiptResponse"
        "503":
          description: Servicio ocupado (OcrBusyException)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReceiptResponse"
