openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
  - url: http://localhost:8080
    description: Generated server url
tags:
  - name: FCM Tokens
    description: Gestion de tokens FCM para notificaciones push
  - name: ChatBot
    description: Chatbot financiero conversacional de Mis Monedas
  - name: Images
    description: Almacenamiento generico de imagenes
  - name: Receipts
    description: Escaneo OCR de recibos
  - name: User Preferences
    description: Gestion de preferencias de usuario
paths:
  /users/{userId}/wallets/{id}:
    get:
      tags:
        - Wallets
      summary: Obtener billetera por ID
      operationId: findById
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WalletResponse"
    put:
      tags:
        - Wallets
      summary: Actualizar billetera
      operationId: update
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WalletResponse"
    delete:
      tags:
        - Wallets
      summary: Deshabilitar billetera
      operationId: disable
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
  /users/{userId}/preferences:
    get:
      tags:
        - User Preferences
      summary: Obtener preferencias del usuario
      operationId: getUserPreferences
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserPreferencesResponse"
    put:
      tags:
        - User Preferences
      summary: Actualizar preferencias del usuario
      operationId: updateUserPreferences
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPreferencesRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserPreferencesResponse"
    post:
      tags:
        - User Preferences
      summary: Crear preferencias del usuario
      operationId: createUserPreferences
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPreferencesRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserPreferencesResponse"
  /users/{id}:
    get:
      tags:
        - Users
      summary: Buscar usuario por ID
      operationId: findUserById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
    put:
      tags:
        - Users
      summary: Actualizar datos de usuario
      operationId: updateUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
  /transactions/{id}:
    get:
      tags:
        - Transactions
      summary: Buscar transaccion
      description: Obtiene una transaccion por ID.
      operationId: findTransactionById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TransactionResponse"
    put:
      tags:
        - Transactions
      summary: Actualizar transaccion
      description: Actualiza una transaccion.
      operationId: updateTransaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TransactionResponse"
    delete:
      tags:
        - Transactions
      summary: Eliminar transaccion
      description: Deshabilita una transaccion.
      operationId: transactionDelete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
  /schedule/{id}:
    put:
      tags:
        - Schedule
      summary: Actualizar programacion
      description: Actualiza una programacion existente.
      operationId: updateSchedule
      parameters:
        - name: id
          in: path
          description: ID de la programacion
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/ScheduleRequest"
                - $ref: "#/components/schemas/BudgetScheduleRequest"
                - $ref: "#/components/schemas/TransactionScheduleRequest"
        required: true
      responses:
        "200":
          description: Actualizada
          content:
            '*/*':
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ScheduleResponse"
                  - $ref: "#/components/schemas/BudgetScheduleResponse"
                  - $ref: "#/components/schemas/TransactionScheduleResponse"
        "400":
          description: Datos invalidos
          content:
            '*/*':
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ScheduleResponse"
                  - $ref: "#/components/schemas/BudgetScheduleResponse"
                  - $ref: "#/components/schemas/TransactionScheduleResponse"
        "404":
          description: No encontrada
          content:
            '*/*':
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ScheduleResponse"
                  - $ref: "#/components/schemas/BudgetScheduleResponse"
                  - $ref: "#/components/schemas/TransactionScheduleResponse"
  /savings/{id}:
    get:
      tags:
        - Savings
      summary: Obtener una meta de ahorro
      description: Obtiene una meta de ahorro por ID.
      operationId: findSavingGoalById
      parameters:
        - name: id
          in: path
          description: ID meta
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Encontrada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SavingGoalResponse"
        "404":
          description: No encontrada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SavingGoalResponse"
    put:
      tags:
        - Savings
      summary: Actualizar meta
      description: Actualiza una meta de ahorro.
      operationId: updateSavingGoal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavingGoalRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SavingGoalResponse"
  /reasons/{id}:
    get:
      tags:
        - Reasons
      summary: Buscar razon
      description: Obtiene una razon por ID.
      operationId: findReasonById
      parameters:
        - name: id
          in: path
          description: ID de la razon
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Encontrada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReasonResponse"
        "404":
          description: No encontrada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReasonResponse"
    put:
      tags:
        - Reasons
      summary: Actualizar razon
      description: Actualiza una razon existente.
      operationId: updateReason
      parameters:
        - name: id
          in: path
          description: ID de la razon
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
        required: true
      responses:
        "200":
          description: Actualizada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReasonResponse"
        "400":
          description: Datos invalidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReasonResponse"
        "404":
          description: No encontrada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReasonResponse"
  /categories/{id}:
    get:
      tags:
        - Categories
      summary: Buscar categoria por ID
      description: Obtiene una categoria especifica.
      operationId: findCategoryById
      parameters:
        - name: id
          in: path
          description: ID de la categoria
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Categoria encontrada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "404":
          description: No encontrada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CategoryResponse"
    put:
      tags:
        - Categories
      summary: Actualizar categoria
      description: Actualiza una categoria existente.
      operationId: updateCategory
      parameters:
        - name: id
          in: path
          description: ID de la categoria
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryRequest"
        required: true
      responses:
        "200":
          description: Actualizada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "400":
          description: Datos invalidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "404":
          description: No encontrada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CategoryResponse"
  /budgets/{id}:
    get:
      tags:
        - Budgets
      summary: Buscar presupuesto
      description: Obtiene un presupuesto por ID.
      operationId: findBudgetById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BudgetResponse"
        "404":
          description: No encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BudgetResponse"
    put:
      tags:
        - Budgets
      summary: Actualizar presupuesto
      description: Actualiza un presupuesto.
      operationId: updateBudget
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BudgetResponse"
  /webhooks/{provider}:
    post:
      tags:
        - Webhooks
      summary: Receive provider webhook
      description: Receives an inbound webhook notification from a payment provider.
      operationId: receiveWebhook
      parameters:
        - name: provider
          in: path
          description: Payment provider
          required: true
          schema:
            type: string
            enum:
              - MERCADO_PAGO
              - CULQI
              - STRIPE
              - MANUAL_TRANSFER
        - name: X-Signature
          in: header
          description: Signature header sent by the provider
          required: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: string
        required: true
      responses:
        "200":
          description: Accepted
        "401":
          description: Invalid signature
        "409":
          description: Duplicate event
  /users/{userId}/wallets:
    get:
      tags:
        - Wallets
      summary: Listar billeteras de un usuario
      operationId: findAllByUser
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WalletResponse"
    post:
      tags:
        - Wallets
      summary: Crear billetera
      operationId: create
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WalletResponse"
  /users/{userId}/fcm-tokens:
    get:
      tags:
        - FCM Tokens
      summary: Listar tokens FCM del usuario
      operationId: listFcmTokens
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FcmTokenResponse"
    post:
      tags:
        - FCM Tokens
      summary: Registrar token FCM
      operationId: registerFcmToken
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterFcmTokenRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/FcmTokenResponse"
  /users/{userId}/chat/sessions:
    get:
      tags:
        - ChatBot
      summary: Listar sesiones del usuario
      description: Retorna todas las sesiones de chat del usuario.
      operationId: findAllSessionsByUser
      parameters:
        - name: userId
          in: path
          description: ID del usuario
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "200":
          description: Lista obtenida exitosamente
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatSessionResponse"
        "404":
          description: Usuario no encontrado
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatSessionResponse"
    post:
      tags:
        - ChatBot
      summary: Iniciar sesion de chat
      description: Crea una nueva sesion de chat e inyecta el contexto financiero
        del periodo actual y anterior.
      operationId: startSession
      parameters:
        - name: userId
          in: path
          description: ID del usuario
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "200":
          description: Sesion creada exitosamente
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ChatSessionResponse"
        "404":
          description: Usuario no encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ChatSessionResponse"
  /users/{userId}/chat/sessions/{sessionId}/messages:
    post:
      tags:
        - ChatBot
      summary: Enviar mensaje al chatbot
      description: |
        Envia un mensaje dentro de una sesion activa. El chatbot detecta automaticamente
        la skill apropiada (ADVISOR para consultas financieras, CHITCHAT para conversacion general)
        e inyecta el contexto financiero cuando corresponde.
        Retorna la respuesta del asistente lista para mostrar al usuario.
      operationId: sendMessage
      parameters:
        - name: userId
          in: path
          description: ID del usuario
          required: true
          schema:
            type: integer
            format: int64
          example: 1
        - name: sessionId
          in: path
          description: ID de la sesion activa
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
        required: true
      responses:
        "200":
          description: Mensaje procesado y respuesta generada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ChatHistoryResponse"
        "400":
          description: Mensaje vacio o invalido
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ChatHistoryResponse"
        "404":
          description: Sesion no encontrada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ChatHistoryResponse"
        "409":
          description: La sesion no esta activa
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ChatHistoryResponse"
  /users/{id}/reset-data:
    post:
      tags:
        - Users
      summary: Resetear datos de usuario
      operationId: resetUserData
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
  /users/{id}/disable:
    post:
      tags:
        - Users
      summary: Deshabilitar usuario
      operationId: disableUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
  /users/{id}/block:
    post:
      tags:
        - Users
      summary: Bloquear usuario
      operationId: blockUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
  /users/{id}/activate:
    post:
      tags:
        - Users
      summary: Habilitar usuario
      operationId: enableUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
  /users/register:
    post:
      tags:
        - Users
      summary: Registrar un nuevo usuario
      operationId: registerUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LoginResponse"
  /transactions:
    post:
      tags:
        - Transactions
      summary: Crear transaccion
      description: Crea una nueva transaccion.
      operationId: createTransaction
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TransactionResponse"
  /subscriptions:
    post:
      tags:
        - Subscriptions
      summary: Create subscription
      description: "Creates a new subscription in PENDING state, awaiting payment\
        \ confirmation."
      operationId: createSubscription
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
        "400":
          description: Invalid data
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
  /subscriptions/{id}/renew:
    post:
      tags:
        - Subscriptions
      summary: Renew subscription
      description: Opens the next billing period for an active subscription.
      operationId: renewSubscription
      parameters:
        - name: id
          in: path
          description: Subscription id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Renewed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
        "404":
          description: Not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
  /subscriptions/{id}/cancel:
    post:
      tags:
        - Subscriptions
      summary: Cancel subscription
      description: Cancels a subscription and disables auto renew.
      operationId: cancelSubscription
      parameters:
        - name: id
          in: path
          description: Subscription id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Canceled
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
        "404":
          description: Not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
  /subscriptions/{id}/activate:
    post:
      tags:
        - Subscriptions
      summary: Activate subscription
      description: Activates a PENDING or PAST_DUE subscription and opens a new billing
        period.
      operationId: activateSubscription
      parameters:
        - name: id
          in: path
          description: Subscription id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Activated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
        "404":
          description: Not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
        "409":
          description: Invalid state transition
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
  /schedule:
    post:
      tags:
        - Schedule
      summary: Crear programacion
      description: Crea una nueva programacion.
      operationId: createSchedule
      requestBody:
        content:
          application/json:
            schema:
              description: Datos de la programacion
              oneOf:
                - $ref: "#/components/schemas/ScheduleRequest"
                - $ref: "#/components/schemas/BudgetScheduleRequest"
                - $ref: "#/components/schemas/TransactionScheduleRequest"
        required: true
      responses:
        "201":
          description: Programacion creada
          content:
            '*/*':
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ScheduleResponse"
                  - $ref: "#/components/schemas/BudgetScheduleResponse"
                  - $ref: "#/components/schemas/TransactionScheduleResponse"
        "400":
          description: Datos invalidos
          content:
            '*/*':
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ScheduleResponse"
                  - $ref: "#/components/schemas/BudgetScheduleResponse"
                  - $ref: "#/components/schemas/TransactionScheduleResponse"
  /schedule/{id}/resume:
    post:
